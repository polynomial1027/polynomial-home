[package]
name = "polynomial-lite"
version = "0.3.8"
edition = "2021"
[build-dependencies]
tauri-build = "=2.7.2"
[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-notification = "=2.6.0"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
