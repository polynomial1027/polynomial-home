name: Verify server and application
on:
  workflow_dispatch:
  push:
    branches: [codex/ai-framework]
    paths: ['server.js', 'lib/**', 'public/**', 'scripts/**', 'tests/**', 'package*.json', 'playwright.config.js', '.github/workflows/verify.yml']
  pull_request:
    paths: ['server.js', 'lib/**', 'public/**', 'scripts/**', 'tests/**', 'package*.json', 'playwright.config.js', '.github/workflows/verify.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/button-audit-report.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/**/button-actions.json
            test-results/**/*inventory.json
            test-results/**/*.png
            docs/BUTTON-REVIEW-*.md
          retention-days: 7
