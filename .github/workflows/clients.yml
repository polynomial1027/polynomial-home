name: Build clients
on:
  workflow_dispatch:
  push:
    branches: [codex/ai-framework]
    paths: ['apps/desktop/**', 'apps/android/**', 'apps/ios/**', '.github/workflows/clients.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run check && npm test
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, platform: mac, arch: arm64}
          - {os: macos-latest, platform: mac, arch: x64}
          - {os: windows-latest, platform: win, arch: x64}
          - {os: windows-latest, platform: win, arch: arm64}
          - {os: ubuntu-latest, platform: linux, arch: x64}
          - {os: ubuntu-latest, platform: linux, arch: arm64}
    runs-on: ${{ matrix.os }}
    defaults:
      run: {working-directory: apps/desktop}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/desktop/package-lock.json}
      - run: npm ci
      - run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/polynomial-upload.p12"
          chmod 600 "$RUNNER_TEMP/polynomial-upload.p12"
      - run: gradle -p apps/android assembleRelease
        env:
          POLYNOMIAL_ANDROID_KEYSTORE: ${{ runner.temp }}/polynomial-upload.p12
          POLYNOMIAL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POLYNOMIAL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POLYNOMIAL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: client-android-release
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  ios-verify:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project apps/ios/Polynomial.xcodeproj -scheme Polynomial -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/polynomial-ios CODE_SIGNING_ALLOWED=NO build
