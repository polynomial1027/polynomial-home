name: Publish client trial
on:
  workflow_dispatch:
  push:
    branches: [codex/ai-framework]
    paths: ['.github/workflows/distribute-clients.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 38509323570 --exit-status --interval 15
          test "$(gh run view 38509323570 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 38509323570 --json headSha --jq .headSha)" = 6bb3546d1ffc01dfd594e611a93d91021832571a
      - name: Download verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38509323570 --dir client-artifacts
      - name: Publish trial installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp client-artifacts/client-android-test/app-debug.apk client-artifacts/Polynomial-0.3.1-android-test.apk
          find client-artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print > /tmp/client-assets.txt
          echo client-artifacts/Polynomial-0.3.1-android-test.apk >> /tmp/client-assets.txt
          cat CHANGELOG-0.3.0.md CHANGELOG-0.3.1.md > /tmp/client-release.md
          gh release view client-v0.3.1 >/dev/null 2>&1 || gh release create client-v0.3.1 --target 6bb3546d1ffc01dfd594e611a93d91021832571a --prerelease --title 'Polynomial 客户端 0.3.1 · 试用版' --notes-file /tmp/client-release.md
          while IFS= read -r asset; do gh release upload client-v0.3.1 "$asset" --clobber; done < /tmp/client-assets.txt
