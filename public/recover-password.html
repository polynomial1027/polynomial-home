<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>恢复密码 · Polynomial Server</title>
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <header class="nav">
      <div class="wrap nav-inner">
        <a class="brand" href="/">POLYNOMIAL <span>SERVER</span></a>
        <nav class="nav-links" style="display: flex"><a href="/login.html">返回登录</a></nav>
      </div>
    </header>
    <main class="auth-shell">
      <form class="auth-card" id="recoveryForm">
        <div class="eyebrow">Local recovery</div>
        <h1>恢复管理员密码</h1>
        <p class="auth-help">请先在服务器本机生成一个 15 分钟有效的一次性恢复码，再在这里设置新密码。</p>
        <div class="field">
          <label for="recoveryUsername">管理员账号</label>
          <input id="recoveryUsername" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="recoveryCode">一次性恢复码</label>
          <input id="recoveryCode" autocomplete="one-time-code" spellcheck="false" required />
        </div>
        <div class="field">
          <label for="recoveryPassword">新密码（至少 4 位）</label>
          <input id="recoveryPassword" type="password" minlength="4" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="recoveryPasswordConfirm">再次输入新密码</label>
          <input id="recoveryPasswordConfirm" type="password" minlength="4" autocomplete="new-password" required />
        </div>
        <div class="notice" id="recoveryNotice" role="status"></div>
        <button class="button" style="width: 100%">设置新密码</button>
        <p class="auth-footnote">服务器命令：<code>npm run recovery-code -- --username 你的账号</code></p>
      </form>
    </main>
    <script src="/assets/site.js"></script>
  </body>
</html>
