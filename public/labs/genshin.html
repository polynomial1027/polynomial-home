<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原神 AI · 测试功能区</title><link rel="stylesheet" href="/labs/lab.css"></head>
<body><header><a href="/app.html#labs">← 测试功能区</a><span>仅管理员</span></header><main class="chat-main"><div class="heading"><div><h1>原神 AI</h1><p>直接提问，回答附带可查看的资料来源。</p></div></div><p id="notice" role="status">正在连接…</p>
<div id="surface" hidden><section class="chat-panel"><div id="thread" aria-live="polite"><div class="empty">想了解角色机制、元素反应，还是比较装备？直接告诉我，也可以连续追问。</div></div><form id="askForm"><label class="sr-only" for="question">你的问题</label><textarea id="question" rows="3" maxlength="2000" placeholder="输入问题，例如：为什么我的火伤不是每一下都蒸发？" required></textarea><div class="chat-compose-footer"><label class="check"><input id="search" type="checkbox" checked>联网查资料</label><button id="send" type="submit">发送</button></div></form></section><small id="budget" class="chat-budget"></small>
<details id="settings" class="chat-settings"><summary>资料与测试设置</summary><section><h2>资料来源</h2><p id="knowledgeStatus" class="muted"></p><small id="domains"></small><ul id="documents"></ul><details><summary>导入手册或数据表（可选）</summary><form id="importForm"><label>标题<input id="docTitle" maxlength="120" required></label><label>适用版本与来源说明<input id="docVersion" maxlength="80" required></label><label>文本文件（MD / TXT / JSON / CSV，250KB）<input id="docFile" type="file" accept=".md,.txt,.json,.csv"></label><label>资料正文<textarea id="docContent" rows="6" required></textarea></label><button>导入资料</button></form></details><p><a href="/labs/calculator.html">高级伤害计算工具 →</a></p></section><section><h2>测试用量记录</h2><p>累计上限不自动重置。搜索费用单独计费；问答不要求填表。</p><form id="budgetForm"><label>累计 token 上限<input id="maxTokens" type="number" min="100000" max="10000000" required></label><label class="check"><input id="confirmBudget" type="checkbox" required>我明确允许提高测试上限</label><button>提高测试上限</button></form><pre id="calls"></pre></section></details></div></main><script src="/labs/genshin.js"></script></body></html>
