<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>登录 · Polynomial Server</title>
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <header class="nav">
      <div class="wrap nav-inner">
        <a class="brand" href="/">POLYNOMIAL <span>SERVER</span></a>
        <nav class="nav-links" style="display: flex">
          <a href="/">返回首页</a>
        </nav>
      </div>
    </header>
    <main class="auth-shell">
      <form class="auth-card" id="loginForm">
        <div class="eyebrow">Polynomial</div>
        <h1>登录账号</h1>
        <p style="color: var(--muted)">
          使用管理员提供的账号登录。
        </p>
        <div class="field">
          <label for="username">账号</label
          ><input id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">密码</label
          ><input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="field" id="loginOtpField" hidden><label for="loginOtp">验证码或一次性恢复码</label><input id="loginOtp" autocomplete="one-time-code" maxlength="32" /></div><div class="notice" id="notice"></div>
        <button class="button" style="width: 100%">登录</button>
        <a class="auth-link" href="/recover-password.html">忘记管理员密码？</a>
      </form>
    </main>
    <script src="/assets/site.js"></script>
  </body>
</html>
